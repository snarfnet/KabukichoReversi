name: KabukichoReversi
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "33"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "歌舞伎町リバース"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_NSUserTrackingUsageDescription: "広告の配信と効果測定のために使用します。"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH
targets:
  KabukichoReversi:
    type: application
    platform: iOS
    sources:
      - KabukichoReversi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.kabukichireversi
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
