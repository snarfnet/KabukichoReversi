name: Build and Upload to App Store

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.4.app

    - name: Set build number
      run: |
        BUILD_NUM=$(date +%s | tail -c 7)
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml

    - name: Generate Xcode project
      run: |
        brew install xcodegen
        xcodegen generate

    - name: Resolve packages
      run: xcodebuild -resolvePackageDependencies -project KabukichoReversi.xcodeproj -scheme KabukichoReversi

    - name: Import Distribution Certificate
      env:
        P12_BASE64: ${{ secrets.DIST_CERT_P12 }}
        P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      run: |
        CERT_PATH=$RUNNER_TEMP/cert.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        echo -n "$P12_BASE64" | base64 --decode -o $CERT_PATH
        security create-keychain -p "" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "" $KEYCHAIN_PATH
        security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Set up ASC API Key
      env:
        ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      run: |
        mkdir -p ~/private_keys
        echo -n "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_WDXGY9WX55.p8

    - name: Build Archive
      run: |
        xcodebuild archive \
          -project KabukichoReversi.xcodeproj \
          -scheme KabukichoReversi \
          -archivePath $RUNNER_TEMP/KabukichoReversi.xcarchive \
          -destination "generic/platform=iOS" \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec \
          CODE_SIGN_STYLE=Automatic \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          DEVELOPMENT_TEAM=JKHY533GM5

    - name: Upload to App Store Connect
      run: |
        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/KabukichoReversi.xcarchive \
          -exportPath $RUNNER_TEMP/export \
          -exportOptionsPlist scripts/ExportOptions.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Install ASC API tools
      run: pip3 install pyjwt requests cryptography

    - name: Submit for Review
      continue-on-error: true
      env:
        ASC_KEY_ID: WDXGY9WX55
        ASC_ISSUER_ID: 2be0734f-943a-4d61-9dc9-5d9045c46fec
        APP_VERSION: "1.0"
        BUILD_NUMBER: ${{ env.BUILD_NUM }}
      run: python3 scripts/submit.py
